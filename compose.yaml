services:
  postgres:
    image: postgres:16-alpine
    container_name: trade-postgres
    environment:
      POSTGRES_DB: trade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trade-pgadmin
    profiles:
      - gui
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.de
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  jmeter-gui:
    image: guitarrapc/jmeter-gui:latest
    container_name: trade-jmeter-gui
    profiles:
      - gui
    stdin_open: true
    tty: true
    ports:
      - "8081:8080"
    volumes:
      - .:/root/jmeter
    extra_hosts:
      - "host.docker.internal:host-gateway"


  jmeter:
    image: justb4/jmeter:latest
    container_name: trade-jmeter
    profiles:
      - test
    volumes:
      - .:/workspace
    working_dir: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      -n -t src/test/jmeter/trade-task-api-test.jmx
      -JHOST=host.docker.internal
      -JPORT=8080
      -l target/jmeter-results.jtl
      -e -o target/jmeter-report

volumes:
  postgres_data:
